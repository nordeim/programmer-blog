packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 9.15+ / 10+ reads overrides from here, not from package.json#pnpm.overrides.
# Moved from package.json to silence: “The \"pnpm\" field in package.json is no longer read”.
overrides:
  "react-email>next": "^16.0.0"
  vitest: "^3.2.6"
  qs: "^6.16.0"
  prismjs: "^1.30.0"
  glob: "^11.0.3"
  esbuild: "^0.25.0"
  "@babel/core": "^7.29.6"
