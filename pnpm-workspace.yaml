packages:
  - 'apps/*'
  - 'packages/*'

# pnpm reads workspace-level `overrides` ONLY from pnpm 10.0.0 onwards.
# Under the pinned pnpm 9.15.4 these entries are INERT — the 9.x-compatible
# location is `package.json#pnpm.overrides`. Kept for a future pnpm 10
# upgrade; do not rely on them while `packageManager` is 9.15.4.
# (R-95, audit C-42: these pins were silently inert when added — the
# react-email subtree they targeted is now removed from dependencies
# entirely, which is what actually cleared the audit.)
overrides:
  "react-email>next": "^16.0.0"
  vitest: "^3.2.6"
  qs: "^6.16.0"
  prismjs: "^1.30.0"
  glob: "^11.0.3"
  esbuild: "^0.25.0"
  "@babel/core": "^7.29.6"
